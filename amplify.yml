version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - chmod +x bin/amplify-build.sh
    build:
      commands:
        - ./bin/amplify-build.sh
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - mullai-periyar-sangam/node_modules/**/*
      - mullai-api/node_modules/**/*
